<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe4cf">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>楞嚴咒粵語讀音</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:#efe4cf;color:#2f271f;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;line-height:2}
header{position:sticky;top:0;z-index:10;background:rgba(239,228,207,.97);border-bottom:1px solid #b9a98e;padding:8px;backdrop-filter:blur(8px)}
h1{font-size:18px;text-align:center;margin:0 0 6px}
.controls,.audio-controls{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center}
button,select{font:inherit;font-size:9px;min-height:27px;padding:2px 5px;border:1px solid #9b8769;border-radius:7px;background:#fffaf0;color:#2f271f}
button:active{transform:scale(.97)}
button:disabled{opacity:.45}
audio{width:min(760px,100%);display:block;margin:6px auto}
#pageState{text-align:center;font-size:10px;color:#6d5f4c;margin-top:3px}
main{max-width:900px;margin:auto;padding:18px 16px 120px}
#pageTitle{text-align:center;font-size:19px;border-bottom:1px solid #b9a98e;padding-bottom:7px}
#pageTime{font-size:12px;font-weight:normal;color:#756650;display:block}
#scripture{white-space:pre-wrap;overflow-wrap:anywhere;font-size:23px;line-height:2.05}
.dark{background:#171717;color:#eee}
.dark header{background:rgba(23,23,23,.97);border-bottom-color:#444}
.dark button,.dark select{background:#292929;color:#eee;border-color:#666}
.dark #pageTime,.dark #pageState{color:#bbb}
#versionTag{position:fixed;right:6px;bottom:5px;font-size:9px;opacity:.55;z-index:30}
#splash{position:fixed;inset:0;z-index:9999;background:#efe4cf;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .35s}
#splash.hide{opacity:0;pointer-events:none}
#splashTitle{font-size:28px;font-weight:700}
#splashSub{font-size:14px;margin-top:6px}
#settingsPanel{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);padding:16px;overflow:auto}
#settingsCard{max-width:520px;margin:20px auto;background:#fffaf0;color:#2f271f;border-radius:12px;padding:16px}
#settingsRows{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}
.timeRow{display:flex;align-items:center;gap:6px}
.timeRow label{font-size:11px;min-width:42px}
.timeRow input{width:82px;font-size:12px;padding:5px}
.settingsActions{display:flex;gap:8px;justify-content:flex-end}
#updateBanner{display:none;position:fixed;left:10px;right:10px;bottom:12px;z-index:300;background:#30271f;color:white;padding:10px;border-radius:10px;text-align:center;font-size:12px}
#updateBanner button{margin-left:8px}
.dark #settingsCard{background:#292929;color:#eee}
.dark #splash{background:#171717;color:#eee}
@media(max-width:520px){
  button,select{font-size:8px;min-height:26px;padding:2px 4px}
  h1{font-size:17px}
  main{padding:14px 14px 110px}
  #scripture{font-size:22px}
}

.doc-black{color:#000000}
.doc-blue{color:#000099}
.dark .doc-black{color:#eeeeee}
.dark .doc-blue{color:#000099}
#scripture{touch-action:pan-y}

</style>
</head>
<body>
<div id="splash"><div id="splashTitle">楞嚴咒</div><div id="splashSub">粵語讀音</div></div>

<header>
<h1>楞嚴咒粵語讀音</h1>
<div class="controls">
<button id="prev">上一頁</button>
<select id="pageSelect" aria-label="選擇頁數"></select>
<button id="next">下一頁</button>
<button id="smaller">字細</button>
<button id="larger">字大</button>
<button id="dark">夜間</button>
<button id="top">頁頂</button>
<button id="settingsBtn" aria-label="時間設定">⚙</button>
</div>
<audio id="player" controls loop preload="metadata">
  <source src="lingyim.mp3" type="audio/mpeg">
</audio>
<div class="audio-controls">
<button id="back10">↶ 10秒</button>
<button id="forward10">10秒 ↷</button>
<label>速度
<select id="speedSelect" aria-label="播放速度">
<option value="0.5">0.5×</option>
<option value="1">1×</option>
<option value="1.5">1.5×</option>
<option value="2">2×</option>
</select>
</label>
</div>
<div id="pageState">播放中：第1頁　閱讀中：第1頁</div>
</header>

<main>
<h2 id="pageTitle"></h2>
<div id="scripture"></div>
</main>

<div id="settingsPanel">
  <div id="settingsCard">
    <h3>每頁結束時間</h3>
    <div style="font-size:11px">格式：分鐘:秒，例如 08:51</div>
    <div id="settingsRows"></div>
    <div class="settingsActions">
      <button id="resetTimes">還原預設</button>
      <button id="closeSettings">取消</button>
      <button id="saveTimes">儲存</button>
    </div>
  </div>
</div>

<div id="updateBanner">有新版本可用 <button id="updateNow">立即更新</button></div>
<div id="versionTag">v5.2.3</div>

const defaultPageEndTimes=[62,93,129,176,219,253,307,342,378,423,455,483,530,586,619,653,703,748,779,810,858,890,940,970,1023,1060,1092,1121];

let pageEndTimes=JSON.parse(localStorage.getItem("lingyim-v5-2-1-page-times")||"null")||[...defaultPageEndTimes];

const KEY={
  page:"lingyim-page",
  scroll:"lingyim-scroll",
  font:"lingyim-font",
  dark:"lingyim-dark",
  audio:"lingyim-audio-time",
  speed:"lingyim-speed"
};

let current=Number(localStorage.getItem(KEY.page)||0);
if(!Number.isInteger(current)||current<0||current>=pages.length)current=0;

let audioPage=0;
let manualLock=0;

const pageSelect=document.getElementById("pageSelect");
const scripture=document.getElementById("scripture");
const pageTitle=document.getElementById("pageTitle");
const player=document.getElementById("player");
const speedSelect=document.getElementById("speedSelect");
const pageState=document.getElementById("pageState");
const settingsPanel=document.getElementById("settingsPanel");
const settingsRows=document.getElementById("settingsRows");

pages.forEach((page,index)=>{
  const option=document.createElement("option");
  option.value=String(index);
  option.textContent=`第 ${page.number} 頁`;
  pageSelect.appendChild(option);
});

function fmt(seconds){
  if(!Number.isFinite(seconds)||seconds<0)seconds=0;
  seconds=Math.floor(seconds);
  const minutes=Math.floor(seconds/60);
  const secs=seconds%60;
  return `${String(minutes).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
}

function pageStart(index){
  return index===0?0:pageEndTimes[index-1];
}

function pageForTime(seconds){
  for(let index=0;index<pageEndTimes.length;index++){
    if(seconds<pageEndTimes[index])return index;
  }
  return pageEndTimes.length-1;
}

function updatePageState(){
  const playing=pages[audioPage]?.number||1;
  const reading=pages[current]?.number||1;
  pageState.textContent=`播放中：第${playing}頁　閱讀中：第${reading}頁`;
}

function getSavedPositions(){
  try{return JSON.parse(localStorage.getItem(KEY.scroll)||"{}")}
  catch{return {}}
}

function saveReadingPosition(){
  const positions=getSavedPositions();
  positions[current]=window.scrollY;
  localStorage.setItem(KEY.scroll,JSON.stringify(positions));
  localStorage.setItem(KEY.page,String(current));
}

function saveAudioState(){
  if(Number.isFinite(player.currentTime)){
    localStorage.setItem(KEY.audio,String(player.currentTime));
  }
  localStorage.setItem(KEY.speed,String(player.playbackRate));
}

function renderPage(index,restoreScroll=true,source="manual"){
  if(index<0||index>=pages.length)return;

  current=index;
  const page=pages[index];

  pageTitle.innerHTML=`第 ${page.number} 頁<span id="pageTime">${fmt(pageStart(index))} – ${fmt(pageEndTimes[index])}</span>`;
  scripture.innerHTML=page.html;
  pageSelect.value=String(index);

  document.getElementById("prev").disabled=index===0;
  document.getElementById("next").disabled=index===pages.length-1;

  localStorage.setItem(KEY.page,String(index));

  if(source==="manual")manualLock=Date.now()+2500;

  updatePageState();

  setTimeout(()=>{
    const y=restoreScroll?Number(getSavedPositions()[index]||0):0;
    window.scrollTo(0,y);
  },80);
}

function syncPageToAudio(force=false){
  const target=pageForTime(player.currentTime||0);
  audioPage=target;
  updatePageState();

  if(!force&&Date.now()<manualLock)return;

  if(target!==current){
    saveReadingPosition();
    renderPage(target,false,"audio");
  }
}

function seekBy(seconds){
  if(!Number.isFinite(player.duration))return;
  player.currentTime=Math.max(0,Math.min(player.duration,player.currentTime+seconds));
  syncPageToAudio(true);
  saveAudioState();
}

document.getElementById("prev").onclick=()=>{
  saveReadingPosition();
  renderPage(current-1,false,"manual");
};

document.getElementById("next").onclick=()=>{
  saveReadingPosition();
  renderPage(current+1,false,"manual");
};

pageSelect.onchange=()=>{
  saveReadingPosition();
  const index=Number(pageSelect.value);
  renderPage(index,true,"manual");

  if(Number.isFinite(player.duration)){
    player.currentTime=pageStart(index);
    saveAudioState();
  }
};


function flipReadingPage(delta){
  const target=current+delta;
  if(target<0||target>=pages.length)return;
  saveReadingPosition();
  renderPage(target,false,"manual");
}

let swipeStartX=null;
let swipeStartY=null;
let swipeStartTime=0;
const readingArea=document.querySelector("main");
readingArea.addEventListener("touchstart",event=>{
  if(event.touches.length!==1)return;
  const touch=event.touches[0];
  swipeStartX=touch.clientX;
  swipeStartY=touch.clientY;
  swipeStartTime=Date.now();
},{passive:true});
readingArea.addEventListener("touchend",event=>{
  if(swipeStartX===null||swipeStartY===null||event.changedTouches.length!==1)return;
  const touch=event.changedTouches[0];
  const dx=touch.clientX-swipeStartX;
  const dy=touch.clientY-swipeStartY;
  const elapsed=Date.now()-swipeStartTime;
  swipeStartX=null; swipeStartY=null;
  if(elapsed>900)return;
  if(Math.abs(dx)<55)return;
  if(Math.abs(dx)<Math.abs(dy)*1.25)return;
  if(dx<0) flipReadingPage(1);
  else flipReadingPage(-1);
},{passive:true});

document.getElementById("top").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});

function changeFont(delta){
  const currentSize=parseInt(getComputedStyle(scripture).fontSize,10)||23;
  const newSize=Math.min(42,Math.max(15,currentSize+delta));
  scripture.style.fontSize=newSize+"px";
  localStorage.setItem(KEY.font,String(newSize));
}

document.getElementById("smaller").onclick=()=>changeFont(-2);
document.getElementById("larger").onclick=()=>changeFont(2);

document.getElementById("dark").onclick=()=>{
  document.body.classList.toggle("dark");
  localStorage.setItem(KEY.dark,document.body.classList.contains("dark")?"1":"0");
};

document.getElementById("back10").onclick=()=>seekBy(-10);
document.getElementById("forward10").onclick=()=>seekBy(10);

speedSelect.onchange=()=>{
  player.playbackRate=Number(speedSelect.value);
  localStorage.setItem(KEY.speed,speedSelect.value);
};

player.addEventListener("loadedmetadata",()=>{
  const savedTime=Number(localStorage.getItem(KEY.audio)||0);
  if(savedTime>0&&savedTime<player.duration)player.currentTime=savedTime;
  syncPageToAudio(true);
});

player.addEventListener("timeupdate",()=>{
  syncPageToAudio(false);
  saveAudioState();
});

player.addEventListener("seeked",()=>syncPageToAudio(true));

window.addEventListener("scroll",()=>{
  clearTimeout(window.__scrollTimer);
  window.__scrollTimer=setTimeout(saveReadingPosition,200);
});

window.addEventListener("beforeunload",()=>{
  saveReadingPosition();
  saveAudioState();
});

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    saveReadingPosition();
    saveAudioState();
  }
});

function secondsToMMSS(seconds){
  seconds=Math.max(0,Math.floor(Number(seconds)||0));
  return `${String(Math.floor(seconds/60)).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}`;
}

function mmssToSeconds(value){
  const match=String(value).trim().match(/^(\d+):([0-5]\d)$/);
  if(!match)return null;
  return Number(match[1])*60+Number(match[2]);
}

function buildTimeSettings(){
  settingsRows.innerHTML="";
  pageEndTimes.forEach((seconds,index)=>{
    const row=document.createElement("div");
    row.className="timeRow";
    row.innerHTML=`<label>第${index+1}頁</label><input data-index="${index}" value="${secondsToMMSS(seconds)}" inputmode="numeric">`;
    settingsRows.appendChild(row);
  });
}

document.getElementById("settingsBtn").onclick=()=>{
  buildTimeSettings();
  settingsPanel.style.display="block";
};

document.getElementById("closeSettings").onclick=()=>settingsPanel.style.display="none";

document.getElementById("resetTimes").onclick=()=>{
  pageEndTimes=[...defaultPageEndTimes];
  buildTimeSettings();
};

document.getElementById("saveTimes").onclick=()=>{
  const inputs=[...settingsRows.querySelectorAll("input")];
  const newTimes=[];

  for(const input of inputs){
    const seconds=mmssToSeconds(input.value);
    if(seconds===null){
      alert(`第${Number(input.dataset.index)+1}頁時間格式錯誤`);
      return;
    }
    newTimes.push(seconds);
  }

  for(let index=1;index<newTimes.length;index++){
    if(newTimes[index]<=newTimes[index-1]){
      alert(`第${index+1}頁時間必須遲過上一頁`);
      return;
    }
  }

  pageEndTimes=newTimes;
  localStorage.setItem("lingyim-v5-2-1-page-times",JSON.stringify(pageEndTimes));
  settingsPanel.style.display="none";
  renderPage(current,true,"startup");
};

function hideSplash(){
  const splash=document.getElementById("splash");
  if(!splash)return;
  setTimeout(()=>splash.classList.add("hide"),650);
  setTimeout(()=>{if(splash.isConnected)splash.remove()},1100);
}

async function checkVersion(){
  try{
    const response=await fetch(`version.json?t=${Date.now()}`,{cache:"no-store"});
    if(!response.ok)return;
    const data=await response.json();

    if(data.version&&data.version!==APP_VERSION){
      const banner=document.getElementById("updateBanner");
      banner.style.display="block";
      document.getElementById("updateNow").onclick=async()=>{
        if("serviceWorker" in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          for(const registration of registrations)await registration.update();
        }
        location.reload();
      };
    }
  }catch(error){
    console.log("Version check skipped",error);
  }
}

const savedFont=Number(localStorage.getItem(KEY.font)||23);
scripture.style.fontSize=savedFont+"px";

if(localStorage.getItem(KEY.dark)==="1"){
  document.body.classList.add("dark");
}

const savedSpeed=Number(localStorage.getItem(KEY.speed)||1);
const allowedSpeeds=[0.5,1,1.5,2];
const speed=allowedSpeeds.includes(savedSpeed)?savedSpeed:1;
player.playbackRate=speed;
speedSelect.value=String(speed);

renderPage(current,true,"startup");

if(document.readyState==="complete"){
  hideSplash();
  checkVersion();
}else{
  window.addEventListener("load",()=>{
    hideSplash();
    checkVersion();
  },{once:true});
}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(console.error);
  },{once:true});
}
</script>
