let current=Number(localStorage.getItem(KEY.page)||0);if(!Number.isInteger(current)||current<0||current>=pages.length)current=0;
let manualLock=0;
const pageSelect=document.getElementById("pageSelect"),scripture=document.getElementById("scripture"),pageTitle=document.getElementById("pageTitle"),player=document.getElementById("player"),speedSelect=document.getElementById("speedSelect"),timeDisplay=document.getElementById("timeDisplay");
pages.forEach((p,i)=>{const o=document.createElement("option");o.value=i;o.textContent=`第 ${p.number} 頁`;pageSelect.appendChild(o)});
function fmt(s){if(!Number.isFinite(s)||s<0)s=0;s=Math.floor(s);const m=Math.floor(s/60),x=s%60;return `${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`}
function start(i){return i===0?0:pageEndTimes[i-1]}
function pageFor(t){for(let i=0;i<pageEndTimes.length;i++)if(t<pageEndTimes[i])return i;return pageEndTimes.length-1}
function positions(){try{return JSON.parse(localStorage.getItem(KEY.scroll)||"{}")}catch{return {}}}
function saveRead(){const p=positions();p[current]=window.scrollY;localStorage.setItem(KEY.scroll,JSON.stringify(p));localStorage.setItem(KEY.page,String(current))}
function saveAudio(){if(Number.isFinite(player.currentTime))localStorage.setItem(KEY.audio,String(player.currentTime));localStorage.setItem(KEY.speed,String(player.playbackRate))}
function render(i,restore=true,source="manual"){if(i<0||i>=pages.length)return;current=i;const p=pages[i];pageTitle.innerHTML=`第 ${p.number} 頁<span id="pageTime">${fmt(start(i))} – ${fmt(pageEndTimes[i])}</span>`;scripture.textContent=p.text;pageSelect.value=String(i);prev.disabled=i===0;next.disabled=i===pages.length-1;localStorage.setItem(KEY.page,String(i));if(source==="manual")manualLock=Date.now()+2500;setTimeout(()=>window.scrollTo(0,restore?Number(positions()[i]||0):0),80)}
function sync(force=false){if(!force&&Date.now()<manualLock)return;const i=pageFor(player.currentTime||0);if(i!==current){saveRead();render(i,false,"audio")}}
function seek(d){if(!Number.isFinite(player.duration))return;player.currentTime=Math.max(0,Math.min(player.duration,player.currentTime+d));sync(true);saveAudio()}
prev.onclick=()=>{saveRead();render(current-1,true,"manual")};next.onclick=()=>{saveRead();render(current+1,true,"manual")};
pageSelect.onchange=()=>{saveRead();const i=Number(pageSelect.value);render(i,true,"manual");if(Number.isFinite(player.duration)){player.currentTime=start(i);saveAudio()}};
top.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
function font(d){const n=Math.min(42,Math.max(15,(parseInt(getComputedStyle(scripture).fontSize)||23)+d));scripture.style.fontSize=n+"px";localStorage.setItem(KEY.font,String(n))}
smaller.onclick=()=>font(-2);larger.onclick=()=>font(2);dark.onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem(KEY.dark,document.body.classList.contains("dark")?"1":"0")};
back10.onclick=()=>seek(-10);forward10.onclick=()=>seek(10);
speedSelect.onchange=()=>{player.playbackRate=Number(speedSelect.value);localStorage.setItem(KEY.speed,speedSelect.value)};
player.addEventListener("loadedmetadata",()=>{const t=Number(localStorage.getItem(KEY.audio)||0);if(t>0&&t<player.duration)player.currentTime=t;sync(true);timeDisplay.textContent=`${fmt(player.currentTime)} / ${fmt(player.duration)}`});
player.addEventListener("timeupdate",()=>{timeDisplay.textContent=`${fmt(player.currentTime)} / ${fmt(player.duration)}`;sync(false);saveAudio()});
player.addEventListener("seeked",()=>sync(true));
window.addEventListener("scroll",()=>{clearTimeout(window._st);window._st=setTimeout(saveRead,200)});
window.addEventListener("beforeunload",()=>{saveRead();saveAudio()});document.addEventListener("visibilitychange",()=>{if(document.hidden){saveRead();saveAudio()}});
scripture.style.fontSize=Number(localStorage.getItem(KEY.font)||23)+"px";if(localStorage.getItem(KEY.dark)==="1")document.body.classList.add("dark");
const savedSpeed=Number(localStorage.getItem(KEY.speed)||1);const speed=[.5,1,1.5,2].includes(savedSpeed)?savedSpeed:1;player.playbackRate=speed;speedSelect.value=String(speed);
render(current,true,"startup");if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
